<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'self'; script-src 'self'">
<title>Updating Desk Reject</title>
<link rel="stylesheet" href="update-window.css">
</head>
<body>
  <div class="panel">
    <div class="wrap">
      <picture class="icon">
        <source id="icon-dark" media="(prefers-color-scheme: dark)" srcset="../assets/icons/icon-mac-1024-dark.png">
        <img id="icon" src="../assets/icons/icon-mac-1024.png" alt="" width="64" height="64">
      </picture>
      <div class="main">
        <div id="title"></div>
        <div id="message"></div>
        <div id="notes-label"></div>
        <div id="notes"></div>
        <label id="check" class="hidden"><input type="checkbox" id="check-box"> <span id="check-label"></span></label>
        <div id="bar" class="bar hidden"><div></div></div>
      </div>
    </div>
    <!-- full width: "Skip This Version" sits at the left edge, under the icon (as in Sparkle) -->
    <div class="foot">
      <div id="left-buttons"></div>
      <div id="detail"></div>
      <div id="buttons"></div>
    </div>
  </div>
  <script src="update-window.js"></script>
</body>
</html>
